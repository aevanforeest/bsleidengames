function getStartOfWeek() {
  const date = new Date();
  const day = date.getDay();
  const diff = (day === 0 ? 6 : day - 1);  
  date.setDate(date.getDate() - diff);
  return date;
}

function formatDate(date) {
  const year = String(date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const dayOfMonth = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${dayOfMonth}`;
}

function getUrl(startDate) {
  return 'https://api.foys.io/competition/public-api/v1/matches'
    + '?startDate=' + formatDate(startDate)
    + '&organisationId=' + ORG_ID
    + '&sorting=date+asc,+startTime+asc';
}

      <div><strong>Datum:</strong> ${match.date ? match.date.split('T')[0] : ''} &nbsp;|&nbsp; <strong>Tijd:</strong> ${match.startTime || ''} &nbsp;|&nbsp; <strong>Status:</strong> ${match.status || ''}</div>
      <div><strong>Thuis:</strong> ${match.homeOrganisation?.name || ''} (${match.homeTeamName || ''})</div>
      <div><strong>Uit:</strong> ${match.awayOrganisation?.name || ''} (${match.awayTeamName || ''})</div>
    </div>
  `).join('');
}
