<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BS Leiden Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: system-ui, sans-serif;
    color: #212529;
    background-color: #f8f9fa;
    margin: 0;
    padding: 2rem;
  }
  main {
    max-width: 1080px;
    margin: 0 auto;
  }
  canvas {
    max-width: 100%;
    height: auto;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>
<div id="container">
</dv>
<script>
const ORG_ID = '7888965c-ba38-4acc-ac15-d6f064014b8b';
const FED_ID = '52cfa65e-9782-4a81-ab35-e2f981fcb7a9';

function getStartOfWeek() {
  const date = new Date();
  const day = date.getDay();
  const diff = (day === 0 ? 6 : day - 1);  
  date.setDate(date.getDate() - diff);
  return date;
}
  
function formatDate(date) {
  const year = String(date.getFullYear());
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const dayOfMonth = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${dayOfMonth}`;
}

function getUrl(startDate) {
  return 'https://api.foys.io/competition/public-api/v1/matches'
    + '?startDate=' + formatDate(startDate)
    + '&skipCount=0&maxResultCount=300'
    + '&organisationId=' + ORG_ID
    + '&sorting=date+asc,+startTime+asc';
}

function loadImage(url) {
  return new Promise((resolve) => {
    if (!url) { resolve(null); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function drawScaledImage(ctx, img, x, y, maxWidth, maxHeight) {
  const ratio = Math.min(maxWidth / img.naturalWidth, maxHeight / img.naturalHeight);
  const w = img.naturalWidth * ratio;
  const h = img.naturalHeight * ratio;
  const offsetX = x + (maxWidth - w) / 2;
  const offsetY = y + (maxHeight - h) / 2;
  ctx.drawImage(img, offsetX, offsetY, w, h);
}

function fillTruncatedText(ctx, text, x, y, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) {
    ctx.fillText(text, x, y)
    return;
  }

  let truncatedText = text;
  while (truncatedText.length > 0 && ctx.measureText(truncatedText + '...').width > maxWidth) {
    truncatedText = truncatedText.slice(0, -1);
  }
  ctx.fillText(truncatedText + '...', x, y);
}

async function renderCanvas(canvas, games, date) {
  const ctx = canvas.getContext('2d');

  await document.fonts.load('32px "Bebas Neue"');

  const IMG_WIDTH = 80;
  const IMG_HEIGHT = 80;

  const ROW_WIDTH = 960;
  const ROW_HEIGHT = 110;

  const rowX = (canvas.width - ROW_WIDTH) / 2;
  let rowY = 200;

  const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgGradient.addColorStop(0, '#201b40');
  bgGradient.addColorStop(1, '#0f0e28');
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const redGlow = ctx.createRadialGradient(canvas.width, canvas.height, 0, canvas.width, canvas.height, canvas.width);
  redGlow.addColorStop(0, 'rgba(255, 0, 0, 0.4)');
  redGlow.addColorStop(1, 'rgba(255, 0, 0, 0)');
  ctx.fillStyle = redGlow;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const day = date.toLocaleDateString('nl-NL', { weekday: 'long' });
  ctx.fillStyle = '#ffffff';
  ctx.font = '128px "Bebas Neue", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(day, canvas.width / 2, rowY / 2 + 16);

  if (games.length === 0) {
    ctx.fillStyle = '#212529';
    ctx.font = '48px "Bebas Neue", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Geen wedstrijden', canvas.width / 2, canvas.height / 2);
    return;
  }

  for (const game of games) {
    const homeLogo = await loadImage(game.homeLogoUrl);
    const awayLogo = await loadImage(game.awayLogoUrl);

    ctx.beginPath();
    ctx.roundRect(rowX, rowY, ROW_WIDTH, ROW_HEIGHT, 12);

    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
    ctx.shadowOffsetY = 4;
    ctx.fill()
    // ctx.fillRect(rowX, rowY, rowWidth, rowHeight);
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.shadowOffsetY = 0;

    if (homeLogo) {
      drawScaledImage(ctx, homeLogo, rowX + 16, rowY + (ROW_HEIGHT - IMG_HEIGHT) / 2, IMG_WIDTH, IMG_HEIGHT);
    }
    ctx.fillStyle = '#212529';
    ctx.font = '32px "Bebas Neue", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    fillTruncatedText(ctx, game.homeOrganisation?.name || '', rowX + 16 + IMG_WIDTH + 16, rowY + ROW_HEIGHT / 2, ROW_WIDTH / 3 - IMG_WIDTH);
    ctx.font = '32px "Bebas Neue", sans-serif';
    ctx.textBaseline = 'top';
    fillTruncatedText(ctx, game.homeTeamName || '', rowX + 16 + IMG_WIDTH + 16, rowY + ROW_HEIGHT / 2, ROW_WIDTH / 3 - IMG_WIDTH);

    const timeStr = game.startTime ? game.startTime.substring(0, 5) : '';
    ctx.fillStyle = '#212529';
    ctx.font = '64px "Bebas Neue", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(timeStr, canvas.width / 2, rowY + ROW_HEIGHT / 2);
    ctx.fillStyle = '#495057';
    ctx.font = '600 16px system-ui, sans-serif';
    ctx.textBaseLine = 'bottom';
    ctx.fillText(game.accommodationName.toUpperCase() || '', canvas.width / 2, rowY + ROW_HEIGHT - 16);

    if (awayLogo) {
      drawScaledImage(ctx, awayLogo, rowX + ROW_WIDTH - IMG_WIDTH - 16, rowY + (ROW_HEIGHT - IMG_HEIGHT) / 2, IMG_WIDTH, IMG_HEIGHT);
    }
    ctx.fillStyle = '#212529';
    ctx.font = '32px "Bebas Neue", sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    fillTruncatedText(ctx, game.awayOrganisation?.name || '', rowX + ROW_WIDTH - 16 - IMG_WIDTH - 16, rowY + ROW_HEIGHT / 2, ROW_WIDTH / 3 - IMG_WIDTH);
    ctx.font = '32px "Bebas Neue", sans-serif';
    ctx.textBaseline = 'top';
    fillTruncatedText(ctx, game.awayTeamName || '', rowX + ROW_WIDTH - 16 - IMG_WIDTH - 16, rowY + ROW_HEIGHT / 2, ROW_WIDTH / 3 - IMG_WIDTH);

    rowY += ROW_HEIGHT + 20;
  }
}

async function renderDay(games, day) {
  const div = document.getElementById('container');
  const homeGames = games.filter(m => m.date.startsWith(formatDate(day)) && m.homeOrganisation?.id == ORG_ID)
  const GAMES_PER_PAGE = 8;
  for (let i = 0; i < homeGames.length; i += GAMES_PER_PAGE) {
    const pageGames = homeGames.slice(i, i + GAMES_PER_PAGE);

    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1350;
    div.appendChild(canvas);
    renderCanvas(canvas, pageGames, day);
  }
}

async function renderWeekend(games, startOfWeek) {
  const excludedProGames = games.filter(m => m.competition.id != 5809 && m.competition.id != 5811);

  const friday = new Date(startOfWeek);
  friday.setDate(friday.getDate() + 4);
  renderDay(excludedProGames, friday);

  const saturday = new Date(startOfWeek);
  saturday.setDate(saturday.getDate() + 5);
  renderDay(excludedProGames, saturday);

  const sunday = new Date(startOfWeek);
  sunday.setDate(sunday.getDate() + 6);
  renderDay(excludedProGames, sunday);
}

async function load() {
  const startOfWeek = getStartOfWeek()
  startOfWeek.setDate(startOfWeek.getDate() + 14)

  try {
    const r = await fetch(getUrl(startOfWeek), {
      headers: { 'X-FederationId': FED_ID }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);

    const json = await r.json();
    console.table(json.items);
    renderWeekend(json.items || [], startOfWeek);
  } catch (e) {
    alert('Error: ' + e.message);
  }
}
load();
</script>
</body>
</html>
