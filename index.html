function getMonday() {
  const date = new Date();
  const day = date.getDay();
  const diff = (day === 0 ? 6 : day - 1);  
  date.setDate(date.getDate() - diff);
  return date;
}

function formatDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const dayOfMonth = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${dayOfMonth}`;
}

function getUrl(startDate) {
  return 'https://api.foys.io/competition/public-api/v1/matches'
    + '?startDate=' + formatDate(startDate)
    + '&skipCount=0&maxResultCount=30'
    + '&organisationId=' + ORG_ID
    + '&sorting=date+asc,+startTime+asc';
}

async function load() {
  const status = document.getElementById('status');
  const monday = getMonday()
  status.textContent = 'Loading...';
  try {
    const r = await fetch(getUrl(monday), {
      headers: { 'X-FederationId': FED_ID }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);

    const json = await r.json();
    const text = await r.text();
    status.textContent = 'Loaded...';

    const games = document.getElementById('games');
    games.innerHTML = '';
    const pre = document.createElement('pre');
    pre.textContent = text;
    games.appendChild(pre);
    // const data = await r.json();
    // render(data.items || [], monday);
    
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}
