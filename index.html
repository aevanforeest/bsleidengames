<!DOCTYPE html>
<html>
<body>
<script>
const URL_ = 'https://api.foys.io/competition/public-api/v1/matches'
  + '?startDate=2026-09-01&skipCoubt=0&maxResultCount=1000'
  + '&organisationId=7888965c-ba38-4acc-ac15-d6f064014b8b'
  + '&sorting=date+asc,+startTime+asc';

async function load() {
  const status = document.getElementById('status');
  try {
    const r = await fetch(URL_, {
      headers: { 'X-FederationId': '52cfa65e-9782-4a81-ab35-e2f981fcb7a9' }
    });
    const data = await r.json();
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(data, null, 2);
    document.body.replaceChildren(pre);
  } catch (e) {
    alert("ERROR");
  }
}
load();
</script>
</body>
</html>
