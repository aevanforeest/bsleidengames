<!DOCTYPE html>
<html>
<body>
<script>
const ORG_ID = '7888965c-ba38-4acc-ac15-d6f064014b8b';
const FED_ID = '52cfa65e-9782-4a81-ab35-e2f981fcb7a9';

function getStartOfWeek() {
  const date = new Date();
  const day = date.getDay();
  const diff = (day === 0 ? 6 : day - 1);  
  date.setDate(date.getDate() - diff);
  return date;
}
  
function formatDate(date) {
  const year = String(date.getFullYear());
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const dayOfMonth = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${dayOfMonth}`;
}

function getUrl(startDate) {
  return 'https://api.foys.io/competition/public-api/v1/matches'
    + '?startDate=' + formatDate(startDate)
    + '&skipCount=0&maxResultCount=300'
    + '&organisationId=' + ORG_ID
    + '&sorting=date+asc,+startTime+asc';
}

async function load() {
  const startOfWeek = getStartOfWeek()
  try {
    const r = await fetch(getUrl(startOfWeek), {
      headers: { 'X-FederationId': FED_ID }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);

    const text = await r.text();
    const pre = document.createElement('pre');
    pre.textContent = text;
    document.body.appendChild(pre);
  } catch (e) {
  }
}
load();
</script>
</body>
</html>
