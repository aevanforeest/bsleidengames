const ORG_ID = '7888965c-ba38-4acc-ac15-d6f064014b8b';
const FED_ID = '52cfa65e-9782-4a81-ab35-e2f981fcb7a9';

function getStartOfWeek() {
  const date = new Date();
  const day = date.getDay();
  const diff = (day === 0 ? 6 : day - 1);  
  date.setDate(date.getDate() - diff);
  return date;
}
  
function formatDate(date) {
  const year = String(date.getFullYear());
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const dayOfMonth = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${dayOfMonth}`;
}

function getUrl(startDate) {
  return 'https://api.foys.io/competition/public-api/v1/matches'
    + '?startDate=' + formatDate(startDate)
    + '&organisationId=' + ORG_ID
    + '&sorting=date+asc,+startTime+asc';
}

function loadImage(url) {
  return new Promise((resolve) => {
    if (!url) { resolve(null); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function renderCanvas(canvasId, games) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');

  await document.fonts.load('40px "Bebas Neue"');

  if (games.length === 0) {
    ctx.fillStyle = '#212529';
    ctx.font = '40px "Bebas Neue", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Geen wedstrijden', canvas.width / 2, canvas.height / 2);
    return;
  }

  const rowWidth = 960;
  const rowHeight = 110;

  const rowX = (canvas.width - rowWidth) / 2;
  let rowY = 200;

  for (const game of games) {
    const homeLogo = await loadImage(game.homeLogoUrl);
    const awayLogo = await loadImage(game.awayLogoUrl);

    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
    ctx.shadowOffsetY = 4;
    ctx.fillRect(rowX, rowY, rowWidth, rowHeight);

    ctx.fillStyle = '#212529';
    ctx.shadowBlur = 0;
    ctx.shadowColor = '';
    ctx.shadowOffsetY = 0;

    if (homeLogo) {
      ctx.drawImage(homeLogo, rowX + 60, rowY + (rowHeight - 48) / 2, 48, 48);
    }
    ctx.font = '32px "Bebas Neue", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(game.homeOrganisation?.name || '', rowX + 120, rowY + 45);
    ctx.font = '32px "Bebas Neue", sans-serif';
    ctx.fillText(game.homeTeamName || '', rowX + 120, rowY + 70);

    const timeStr = game.startTime ? game.startTime.substring(0, 5) : '';
    ctx.font = '64px "Bebas Neue", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(timeStr, canvas.width / 2, rowY + 72);

    if (awayLogo) {
      ctx.drawImage(awayLogo, rowX + rowWidth - 60, rowY + (rowHeight - 48) / 2, 48, 48);
    }
    ctx.font = '32px "Bebas Neue", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(game.awayOrganisation?.name || '', rowX + rowWidth - 120, rowY + 45);
    ctx.font = '32px "Bebas Neue", sans-serif';
    ctx.fillText(game.awayTeamName || '', rowX + rowWidth - 120, rowY + 70);

    rowY += rowHeight + 20;
  }
}

async function renderGames(games) {
  if (!games || games.length == 0) {
   return;
  }

  const saturdayHomeGames = games.filter(m => m.date.startsWith('2026-10-17') && m.homeOrganisation?.id == ORG_ID);
  await renderCanvas('saturdayHomeGames', saturdayHomeGames);
}

async function load() {
  const startOfWeek = getStartOfWeek()
  renderGames(json.items || [], startOfWeek);
