name: Update matches
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update matches
        run: |
          TODAY=$(date +%F)
          curl -sS --fail \
            -H "Referer: https://basketball.nl/" \
            -H "Origin: https://basketball.nl" \
            -H "Accept: application/json" \
            "https://api.foys.io/competition/public-api/v1/matches?startDate=2026-10-15&skipCount=0&maxResultCount=30&sorting=date+asc,+startTime+asc" \
            -o matches.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add matches.json
          git diff --cached --quiet || (git commit -m "Update matches" && git push)
